name = "primes_restricted_digits"
version = "0.1.0"
defaultTargets = ["PrimesRestrictedDigits"]
moreLeanArgs = ["-DautoImplicit=false"]
weakLeanArgs = ["--tstack=16384"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "PrimesRestrictedDigits"

[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]
